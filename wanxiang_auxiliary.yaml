# 辅助码转写规则，由 build 中的辅助码资源引用。
万象:
  # 从左侧分号定位，允许省略尾部字段；组内多码按 1、2、4 递进派生（最多 8 码）
  - "derive|^()(?:[a-z]{2},){1}([a-z]{2}(?:,[a-z]{2})*(?:;.*)?)$|$1$2|"
  - "derive|^()(?:[a-z]{2},){2}([a-z]{2}(?:,[a-z]{2})*(?:;.*)?)$|$1$2|"
  - "derive|^()(?:[a-z]{2},){4}([a-z]{2}(?:,[a-z]{2})*(?:;.*)?)$|$1$2|"
  - "aux|^([a-z])([a-z])(?:,[a-z]{2})*(?:;.*)?$|$1|"
  - "aux|^([a-z])([a-z])(?:,[a-z]{2})*(?:;.*)?$|$1$2/|"
  # 大写辅助只使用 AUX 编码，不保留拼音或双拼前缀
  - 'aux|^([a-z])([a-z])(?:,[a-z]{2})*(?:;.*)?$|\u$1|'
  - 'aux|^([a-z])([a-z])(?:,[a-z]{2})*(?:;.*)?$|$1\u$2|'
  - 'aux|^([a-z])([a-z])(?:,[a-z]{2})*(?:;.*)?$|\u$1$2|'
  - 'aux|^([a-z])([a-z])(?:,[a-z]{2})*(?:;.*)?$|\u$1\u$2|'
  - "aux|^([a-z])([a-z])(?:,[a-z]{2})*(?:;.*)?$|$1$2|abbrev,display"

