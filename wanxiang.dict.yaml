# Rime dictionary
# encoding: utf-8
# 
# rime配置的部署位置：
# ~/.local/share/fcitx5/rime 或者 ~/.config/ibus/rime  (Linux)
# ~/Library/Rime  (Mac OS)
# %APPDATA%\Rime  (Windows)
# 
#

---
name: wanxiang
version: "LTS"
sort: by_weight  #字典初始排序，可選original或by_weight
use_preset_vocabulary: false
import_tables:
  - dicts/zi            #必要|字表，包含了所有带拼音的汉字
  - dicts/jichu         #必要|基础词库，构成基本单元的词条
  - dicts/cuoyin        #必要|错音错字，支持错音和错字输入的兼容，同时供超级注释lua使用会在输入错误音节打出的时候给予提示
  - dicts/duoyin        #必要|兼容词库，是基础词库的扩充，收录了多场景多种读音的词组
  - dicts/diming        #必要|地名
  - dicts/mingren       #必要|名人
  - dicts/yiren         #艺人
  #- dicts/yixue         #医学
  #- dicts/huaxue        #化学
  #- dicts/yaopin        #药品
  #- dicts/wuzhong       #物种多样性
  #- dicts/taifeng       #最新台风表
  #- dicts/fangyan       #收集全国方言
  #- dicts/shici         #更多诗词，基础词库已经收纳小学到高中及网络传唱诗词
  # 更多词库获取：https://github.com/amzxyz/rime-wanxiang-data/releases/tag/dict-nightly
...