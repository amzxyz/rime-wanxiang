        - "aux|^(?:[^,]*,){8}([a-z])([a-z])$|$1$2|abbrev"
        - "aux|^(?:[^,]*,){8}([a-z])([a-z])$|$1$2/|"

speller:
  # table_translator翻译器，支持自动上屏。例如 “zmhu”可以自动上屏“怎么回事”
  #  auto_select: true
  #  auto_select_pattern: ^[a-z]+/|^[a-df-zA-DF-Z]\w{3}|^e\w{4}
  # 如果不想让什么标点直接上屏，可以加在 alphabet，或者编辑标点符号为两个及以上的映射
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA7890`;/\
  # initials 定义仅作为始码的按键，排除 ` 让单个的 ` 可以直接上屏
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA/
  delimiter: " '"  # 第一位<空格>是拼音之间的分隔符；第二位<'>表示可以手动输入单引号来分割拼音。

# 处理符合特定规则的输入码，如网址、反查
recognizer:
  import_preset: default  # 从 default.yaml 继承通用的
  patterns:  # 再增加方案专有的：
    punct: "^/(?!/)(?:[A-Za-z]+|[!-/:-@\\[-`{-~][!-/:-~]?[A-Za-z]?|[A-Za-z][!-\\+/:-<>-@\\\\\\^-`{-~][A-Za-z]?|[ADEIKLOTUadeilotu]-[A-Za-z]?|[CEHLNPRTWYc-ehpry]=[A-Za-z]?|[AC-EG-IKLNOR-Ua-eg-iklnor-u],[A-Za-z]?|[B-GIMPS-UZb-gimpstz]\\.[A-Za-z]?|\\([)A-Za-z]\\)|--[-.]|\\\\o/|[0-9]|0[3*~]|1(?:[0-9^]|10)|2[35^]|3[458^]|45|5[68]|78|88|\\*0|<3|\\^[0-9]|_[0-9]|~0|\\((?:[0-9]|[1-4][0-9]|50)\\)?)$"
    super_sym: "^/sym[.?/][A-Za-z.]+$"  # /sym.arrow.r.double 精确  /sym?keyword 或 /sym/keyword 模糊
    super_emoji: "^/emoji[.?/][A-Za-z.]+$"  # /emoji.apple.red  /emoji?keyword  /emoji/keyword
    super_sym_pre: "^/sym[.?/]?$"  # 仅 /sym /sym. /sym? /sym/ 模式提示
    super_emoji_pre: "^/emoji[.?/]?$"  # 仅 /emoji /emoji. /emoji? /emoji/ 模式提示
    wanxiang_reverse: "^`[A-Za-z7890;]*$"  # 响应部件拆字与笔画的反查，与 radical_lookup/prefix 匹配
    add_user_dict: "^``[A-Za-z/`']*$"  #自造词
    unicode: "^U([0-9A-Fa-f]*|[xXhH][0-9A-Fa-f]*|[dD][0-9]*|[bB][01]*|[oO][0-7]*|0[xX][0-9A-Fa-f]*|0[dD][0-9]*|0[bB][01]*|0[oO][0-7]*|\\+[0-9A-Fa-f]*|c.*)$"  # U 作为触发前缀，响应 lua_translator@unicode_conversion，输出 Unicode 字符
    number: "^R(-|-?[0-9]+[.:]?[0-9]*)$"  # 脚本将自动获取第 2 个字符 R 作为触发前缀，响应 lua_translator@number_conversion，数字金额大写
    sjc: "^[/o]rc\\d+[-+=op]?$"
    yr1: "^N0[1-9]?0?[1-9]?"
    yr2: "^N1[02]?0?[1-9]?"
    yr3: "^N0[1-9]?[1-2]?[1-9]?"
    yr4: "^N1[02]?[1-2]?[1-9]?"
    yr5: "^N0[1-9]?3?[01]?"
    yr6: "^N1[02]?3?[01]?"
    nyr1: "^N19?[0-9]?[0-9]?[0-1]?[0-9]?[0-9]?[0-9]?"
    nyr2: "^N20?[0-9]?[0-9]?[0-1]?[0-9]?[0-9]?[0-9]?"
    nyr_diff: "^N(19|20)[0-9]{6}-[0-9]{0,8}$"
    calculator: "^V.*$"  #计算器功能引导
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"  # email @ 之后不上屏
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$"  # URL
    htj: "^/htj.*$"
# 标点符号
# punctuator 下面有三个子项：
# 设置为一个映射，就自动上屏；设置为多个映射，如 '/' : [ '/', ÷ ] 则进行复选。
#   full_shape: 全角没改，使用预设值
#   half_shape: 标点符号全部直接上屏，和 macOS 自带输入法的区别是
#              '|' 是半角的，
#              '~' 是半角的，
#              '`'（反引号）没有改成 '·'（间隔号）。
#   symbols    Rime 的预设配置是以 '/' 前缀开头输出一系列字符，自定义的修改 symbols.yaml
punctuator:
  digit_separators: ":,."  #数字分隔符
  __include: wanxiang_symbols:/symbol_table  # 从 symbols.yaml 导入配置
  __patch: wanxiang_symbols:/symbols


# 从 default 继承快捷键
key_binder:
  import_preset: default  # 从 default.yaml 继承通用的
  # Lua 配置: shijian.lua 的引导符，涉及：日期、时间、节日、节气、生日、问候模板等功能
  shijian_keys: ["/", "o"]
  bindings:  # 也可以再增加方案专有的
    # 通过按下/发送/+1节约一个按键，不冲突的时候可以开启
    #- { match: "[a-z]{1,4}", accept: "/",  send_sequence: "/1" }
    # 翻页 , .
    # - { when: paging, accept: comma, send: Page_Up }
    # - { when: has_menu, accept: period, send: Page_Down }
    # 翻页 [ ]
    # - { when: paging, accept: bracketleft, send: Page_Up }
    # - { when: has_menu, accept: bracketright, send: Page_Down }
    # 翻页 - =
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
    - {when: always, toggle: ascii_punct, accept: Control+Shift+3}  # 切换中英标点
    - {when: always, toggle: ascii_punct, accept: Control+Shift+numbersign}  # 切换中英标点
    - {when: always, toggle: s2t, accept: Control+Shift+4}  # 切换简繁
    - {when: always, toggle: s2t, accept: Control+Shift+dollar}  # 切换简繁
    - {when: composing, accept: Alt+Left, send: Shift+Left}
    - {when: composing, accept: Alt+Right, send: Shift+Right}
    - {when: composing, accept: Control+w, send: Control+BackSpace}
    # 分号用于次选，微软、搜狗双拼不可启用
    #- { when: has_menu, accept: semicolon, send: 2 }
    # 使用Control+e进入翻译模式
    - {when: has_menu, accept: "Control+e", toggle: english_chinese}
    # 使用快捷键Control+c拆分显示
    - {when: has_menu, accept: "Control+c", toggle: chaifen_switch}
    # 使用快捷键Control+a开启和关闭辅助码显示
    - {when: has_menu, accept: "Control+a", toggle: fuzhu_hint}
    # 通过快捷键Control+s使得输入码显示音调
    - {when: has_menu, accept: "Control+s", toggle: tone_display}
    # 通过快捷键Control+t开启超级tips
    - {when: has_menu, accept: "Control+t", toggle: super_tips}
    # 通过快捷键Control+g开启字符集过滤
    - {when: has_menu, accept: "Control+g", toggle: charset_filter}
    - {when: composing, accept: "Control+g", toggle: charset_filter}
    - {when: always, accept: Shift+space, select: .next}  #下一个方案
    # 使用 tab 在不同音节之间跳转
    - {when: has_menu, accept: "Tab", send: "Control+Right"}
    - {when: composing, accept: "Tab", send: "Control+Right"}
    # 当tab第一个字补码正确后，可以使用Ctrl+tab进行上屏并依次补码
    - {when: composing, accept: "Control+Tab", send_sequence: '{Home}{Shift+Right}{1}{Shift+Right}'}
    # 当输入编码后发现没有词，则通过双击``进入造词模式而且不需要删除编码，这个功能与``直接引导相呼应相配合
    - {match: "^.*`$", accept: "`", send_sequence: '{BackSpace}{Home}{`}{`}{End}'}
    # 斜杠被占用引导符号，因此输入本身设置为双击
    - {match: "^/$", accept: "/", send_sequence: '{space}'}
    #按下快捷键将开关切换到对应状态再发送快捷键，最终执行快捷键所对应的操作
    - {accept: Shift+Return, send_sequence: '{option:tone_display=true}{Shift+Return}{option:tone_display=false}'}


editor:
  bindings:
    space: confirm  # 空格键：上屏候选项
    Return: commit_raw_input  # 回车键：上屏原始输入
    Control+Return: commit_script_text  # Ctrl+回车键：上屏变换后输入（经过 preedit转换的）
    Control+Shift+Return: commit_comment  # Ctrl+Shift+回车键：上屏 comment
    BackSpace: revert  # 退格键：向前删除（撤消上次输入）
    Delete: delete  # Delete 键：向后删除
    Control+BackSpace: back_syllable  # Ctrl+退格键：删除一个音节
    Escape: cancel  # Esc 键：取消输入
    Control+Delete: auto_delete  #重置自动造词
    Shift+Delete: manual_delete  #重置手动造词
    Control+Up: manual_up  #将当前高亮选中词条上移/左移
    Control+Down: manual_down  #将当前高亮选中词条上移/左移

# 在边界按音节移动，在音节内部按字符移动  rewind , forward
# 按字符移动（循环）       left_by_char , right_by_char
# 按字符移动（不循环）     left_by_char_no_loop , right_by_char_no_loop
# 按音节跳转（循环）       left_by_syllable , right_by_syllable
# 按音节跳转（不循环）     left_by_syllable_no_loop , right_by_syllable_no_loop
navigator:
  bindings:
    Left: left_by_char_no_loop
    Right: right_by_char_no_loop
    Shift+Left: left_by_syllable
    Shift+Right: right_by_syllable

super_comment:  # 超级注释模块，子项配置 true 开启，false 关闭
  candidate_length: 1  # 候选词辅助码提醒的生效长度，0为关闭  但同时清空其它，应当使用上面开关来处理
  corrector_type: "〔comment〕"  # 随意更换左右括号，比如"〔comment〕" 不加括号为无括号，comment占位不能动
  tone_isolate: true  # 是否将数字声调从转换后拼音中隔离出来（true=隔离， false 直接参与转换）例如：nǐ3
  convert_abbrev_preedit: false  #单音节简码是否转换为全拼读音
  cand_type:
    user_phrase: "⁺"
    sentence: ""
    phrase: ""
    table: ""
    user_table: ""
    custom_phrase: ""
    completion: ""
    abbrev: ""
    predict: ""
    fallback: "~"

super_processor:
  enable_backspace_limit: true  # 开启/关闭退格限制
  enable_seg_loop: true  # 开启/关闭分词符（'）循环
  enable_tone_fallback: true  # 启用声调回退
  enable_predict_space: false  # 启用联想空格打断，直接上屏空格并清空联想，对齐大厂，如果用原生librime-predict这个还有用留着
  limit_repeated: "8,40"  #格式："最大重复声母数,最大候选字数"

unicode:
  key: Control+u

context_reorder:
  db_name: context_reorder
  enable_fallback_reorder: false
  context_timeout: 5000
  custom_classifiers:
    - 个只名位口人头匹条群批伙多
    - 张把件台部块根颗粒滴片朵面扇顶栋座所辆艘架盏支枝杆
    - 双对副套打串束排阵堆叠摞扎
    - 杯瓶盒包份碗锅盆桶袋罐盘
    - 次场局回趟顿番遍声项宗桩款步招
    - 年月天周岁秒分刻代期届任夜季
    - 本册篇首句段卷幅节堂门帖字行
    - 米寸尺里斤两吨克升元角毛笔百千万亿

super_tips:
  tips_key: "comma"  # key英文单词不清楚去default找
  files:  # 自定义数据文件列表（可选，不配置则使用默认文件）
    - lua/data/tips_show.txt  # 仍可保留默认文件
    #- lua/data/my_tips.txt     # 用户自定义文件
  disabled_types:
    - "禁用类型A"
    - "禁用类型B"
    # 禁用的 tips 类型，初始化 tips 数据库的时候会直接忽略相关规则，修改部署后生效
    # 可选项为：偏旁，符号，化学式，时间，符号，组字，翻译，表情，货币，车牌, 单位

super_symbols:
  prefix_sym: "/sym"      # sym精确前缀，配合 . 触发，如 /sym.arrow.r.double
  prefix_emoji: "/emoji"    # emoji 精确前缀
  max_candidates: 30         # 最大候选数
  data_sym: "lua/data/codex_sym.txt"
  data_emoji: "lua/data/codex_emoji.txt"

force_upper_aux:
  hotkey: "F1"  #用来固定候选的快捷键，原理是用双大写字母定字,能用组合键能用符号Tab等，按一下固定当前可见候选，按两下固定N-1个字状态下记录的字
  symbol: "›"  #用来替代双大写字母辅助的preedit视觉拉长的问题

#常规状态下数字转换成相应的字符，由超级preedit接管
tone_preedit:
  "7": "¹"
  "8": "²"
  "9": "³"
  "0": "⁴"

super_sequence:  # Lua 配置：手动排序的快捷键 super_sequence.lua，不要用方向键，各种冲突，一定要避免冲突
  db_name: "sequence"
  up: "Control+j"  # 上移
  down: "Control+k"  # 下移
  reset: "Control+l"  # 重置
  pin: "Control+p"  # 置顶

random_tools:
  uuid: "/uuid"
  uuid7: "/uuidq"
  ulid: "/ulid"
  password: "/mima"
  password_special: "/mimas"
  password_lengths: "6,8,10,16"
  chars:
    upper: "ABCDEFGHJKLMNPQRSTUVWXYZ"
    lower: "abcdefghijkmnopqrstuvwxyz"
    digit: "23456789"
    special: "!@#$%^&*_-+"

input_stats:
  db_name: "stats"  # 自定义统计数据库路径
  triggers:
    local_total: "/btj"  # 查设备生涯统计
    today: "/rtj"  # 查今日（日统计）
    week: "/ztj"  # 查本周（周统计）
    month: "/ytj"  # 查本月（月统计）
    year: "/ntj"  # 查本年（年统计）
    total: "/tj"  # 查生涯（总统计）
    history: "/htj"  # 时光机：查历史。用法示例输入：/htj20231015，从年月日依次递进，以t间隔查区间/htj20231015t20240102

# 如果你不配 titles，默认会使用内置的“打字流派”段位。
# 如果你想魔改（比如修真流），就取消下面这段注释：
#  titles:  #对齐：triggers
#    - "0:初入道途·炼气期"
#    - "10000:小有所成·筑基期"
#    - "50000:凝真化虚·金丹期"
#    - "100000:破茧成蝶·元婴期"
#    - "500000:掌控法则·化神期"
#    - "1000000:破碎虚空·渡劫期"

# 字符集过滤lua
# a,通用规范汉字表
# b,GB2312,
# g,GBK,
# T,Big5,(台港澳常用)
# j,简体,OpenCC (t2s)
# f,通用繁体,OpenCC (s2t)
# h,香港繁体, OpenCC (s2hk)
# t,台湾繁体, OpenCC (s2tw)
# u,基本区,U+4E00 - U+9FFF
# A-I,扩展 A-I 区,U+3400 及各扩展区 (支持到 Ext-I)
# c,兼容区汉字
# 你可以通过黑白名单微调你自己每个开关下面的字符集过滤清单，主数据库位于lua/charset.reverse.bin不可编辑
# 你可以按上面提到的规则代号在base处填写上基础集，还可以在每一个开关的开白名单设置微调数据，就像默认添加的字符集过滤在8105基础上新增了一些
# 你可以定义多个开关，多个开启状态的开关求并集，比如charset_filter开着，s2hk也开着，那么就会显示这两个集合的所有汉字
# 优雅的地方在于s2hk开着，charset_filter关着 我们照样能使用 港繁能用到的所有字，是真正的本体，无关字会被过滤，而当都开着则是享受简体转换成繁体的后的结果
# 这个设计真正的兼容了简繁转换与字符集过滤的矛盾，还能满足用户多种自定义需求，你可以在开关增加类别，并在charset下面新增option类去选择按照字区去过滤，等多种组合方式
charset_filter:
  - option: charset_filter
    base: a
    addlist:
      - "诶濛硷氽尛躝〇冇吔磺咗囧屌鲶芶咲畑垅𰻝𰻞龍朙頔雲"
    blacklist: []
  - option: s2t
    base: fa
    addlist: []
    blacklist: []
  - option: s2hk
    base: ha
    addlist: []
    blacklist: []
  - option: s2tw
    base: ta
    addlist: []
    blacklist: []

#shijian:仅支持修改前缀，为了固定习惯，后两码写死，如有需求lua中修改
#时间：osj 或者 /sj
#日期：orq 或者 /rq
#农历：onl 或者 /nl
#星期：oxq 或者 /xq
#今年第几周：oww 或者 /ww
#节气：ojq 或者 /jq
#日期+时间：odt 或者 /dt
#时间戳：ott 或者 /tt
#大写N日期：N20250315 或者N0312不带年
#节日：ojr 或者 /jr
#问候模板：/day 或者 oday
# 通用日期时间格式化函数（供 /rq、/sj、/dt、N0101、N20150101 场景复用）
# 支持转义：
#   \X       —— 转义单个字符 X，按字面量输出（如 \Y \m \H 等）
#   [[...]]  —— 区块整体按字面量输出
#
# 约定占位符：
# 【日期】
#   Y  四位年份           0000-9999  例：2025
#   y  两位年份           00-99      例：25
#   m  月（前导零）        01-12      例：02
#   n  月（不带前导零）     1-12       例：2
#   d  日（前导零）        01-31      例：09
#   j  日（不带前导零）     1-31       例：9
#   B  月（英文完整单词）    August
#   b  月（英文单词前缀）    Aug
#
# 【时间】
#   H  24小时（前导零）   00-23      例：08
#   G  24小时（不带零）   0-23       例：8
#   I  12小时（前导零）   01-12      例：08
#   l  12小时（不带零）   1-12       例：8   （注意是小写 L）
#   M  分钟（前导零）     00-59      例：05
#   S  秒（前导零）       00-59      例：09
#   p  am/pm（小写）     am / pm
#   P  AM/PM（大写）     AM / PM
# 【时区】
#   O  带冒号格式        +08:00、-04:30、+05:45
#   o  不带冒号格式      +0800、-0430、+0545
#   A  中文时段    凌晨 / 上午 / 中午 / 下午 / 晚上
# 【星期】
#   w  年第几周     01
#   E  英文星期全称  Sunday
#   F  英文星期简称  Sun
#   C  中文星期全称  星期一
#   D  中文星期简称  周一
date_formats:
  - "Y年m月d日"
  - "Y-m-d"
  - "Y/m/d"
  - "Y.m.d"
  - "Ymd"
  - "Y年n月j日"
  - "y年n月j日"
  - "n月j日"
time_formats:
  - "H:M"
  - "H点M分"
  - "H:M:S"
  - "H时M分S秒"
  - "AI:M"
  - "I:M P"
datetime_formats:
  - "Y-m-d H:M:S"
  - "Y-m-dTH:M:S O"
  - "YmdHMS"
  - "Y年m月d日 H点M分"
  - "y/m/d I:M p"
english_date_formats:
  - "B j, Y"
  - "j b Y"
  - "Y-m-d"

# a/、单字母组合，触发预设编码自动上屏快符，支持将值设为"repeat" 以支持对应按键重复上屏功能，custom>schema>lua最终合并键值
# 现在就支持26字母快符，结合成对符号输入，这边的压力小一些
quick_symbol_text:
  trigger: "^([a-z])/$"
  symkey:
    q: "repeat"
    w: "？"
    e: "（"
    r: "）"
    t: "\t"
    y: "·"
    u: "『"
    i: "』"
    o: "〖"
    p: "〗"
    a: "！"
    s: "……"
    d: "、"
    f: "“"
    g: "”"
    h: "‘"
    j: "’"
    k: "【"
    l: "】"
    z: "。”"
    x: "？”"
    c: "！”"
    v: "——"
    b: "%"
    n: "《"
    m: "》"

#通过在有候选的情况下，通过末尾检测到形如\a来触发为第一候选进行成对符号包裹例如nihao\c 候选[你好]
#trigger只能设置为单符号，因为按下一次锁定第一候选，按下映射开始包裹符号pro用户不能设置为/
#两个字符可以不用|默认前后分割，需要明确区分前后的使用|分割，可以有一侧为空，不可以使用多个||
paired_symbols:
  trigger: "\\"  #(注意反斜杠这是转义写法\\使用时\单反斜杠即可)
  symkey:
    # ===== 基本括号与引号 =====
    a: "[]"  # 方括号
    b: "【】"  # 黑方头括号
    c: "❲❳"  # 双大括号 / 装饰括号
    d: "〔〕"  # 方头括号
    e: "⟮⟯"  # 小圆括号 / 装饰括号
    f: "⟦⟧"  # 双方括号 / 数学集群括号
    g: "「」"  # 直角引号
    # h: 预留用于 Markdown 一级标题
    i: "『』"  # 双直角引号
    j: "<>"  # 尖括号
    k: "《》"  # 书名号（双）
    l: "〈〉"  # 书名号（单）
    m: "‹›"  # 法文单书名号
    n: "«»"  # 法文双书名号
    o: "⦅⦆"  # 白圆括号
    p: "⦇⦈"  # 白方括号
    q: "()"  # 圆括号
    r: "|儿"  #儿化候选
    s: "［］"  # 全角方括号
    t: "⟨⟩"  # 数学角括号
    u: "〈〉"  # 数学尖括号
    v: "〖〗"  # 装饰花括号
    w: "（）"  # 全角圆括号
    x: "｛｝"  # 全角花括号
    y: "⟪⟫"  # 双角括号
    z: "{}"  # 花括号

    # ===== 扩展括号族 / 引号 =====
    dy: "''"  # 英文单引号
    sy: "\"\""  # 英文双引号
    zs: "“”"  # 中文弯双引号
    zd: "‘’"  # 中文弯单引号
    fy: "``"  # 反引号

    # ===== 双字母括号族 =====
    aa: "〚〛"  # 双中括号
    bb: "〘〙"  # 双中括号（小）
    cc: "〚〛"  # 双中括号（重复，可用于 Lua 匹配）
    dd: "❨❩"  # 小圆括号装饰
    ee: "❪❫"  # 小圆括号装饰
    ff: "❬❭"  # 小尖括号装饰
    gg: "⦉⦊"  # 双弯方括号
    fa: "⦋⦌"  # 双弯方括号
    ii: "⦍⦎"  # 双弯方括号
    jj: "⦏⦐"  # 双弯方括号
    kk: "⦑⦒"  # 双弯方括号
    ll: "❮❯"  # 小尖括号装饰
    mm: "⌈⌉"  # 上取整 / 数学符号
    nn: "⌊⌋"  # 下取整 / 数学符号
    oo: "⦗⦘"  # 双方括号装饰（补齐）
    pp: "⦙⦚"  # 双方括号装饰（补齐）
    qq: "⟬⟭"  # 小双角括号
    rr: "❴❵"  # 花括号装饰
    ss: "⌜⌝"  # 数学上角符号
    tt: "⌞⌟"  # 数学下角符号
    uu: "⸢⸣"  # 装饰方括号
    vv: "⸤⸥"  # 装饰方括号
    ww: "﹁﹂"  # 中文书名号 / 注释引号
    xx: "﹃﹄"  # 中文书名号 / 注释引号
    yy: "⌠⌡"  # 数学 / 程序符号
    zz: "⟅⟆"  # 数学 / 装饰括号

    # ===== Markdown / 标记 =====
    md: "**|**"  # Markdown 粗体
    jc: "**|**"  # 加粗
    it: "__|__"  # 斜体
