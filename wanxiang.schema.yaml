        - "aux|^(?:[^,]*,){6}([a-z])([a-z])(?:,[^,]*){2}$|$1$2|abbrev"
        - "aux|^(?:[^,]*,){6}([a-z])([a-z])(?:,[^,]*){2}$|$1$2/|"

      首右:
        - "aux|^(?:[^,]*,){7}([a-z])([a-z]),[^,]*$|$1|"
        - "aux|^(?:[^,]*,){7}([a-z])([a-z]),[^,]*$|$1$2|abbrev"
        - "aux|^(?:[^,]*,){7}([a-z])([a-z]),[^,]*$|$1$2/|"

      首右Plus:
