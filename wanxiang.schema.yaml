        - "aux|^(?:[^,]*,){5}([a-z])([a-z])(?:,[^,]*){3}$|$1$2|abbrev"
        - "aux|^(?:[^,]*,){5}([a-z])([a-z])(?:,[^,]*){3}$|$1$2/|"

      汉心码:
