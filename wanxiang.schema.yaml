# Rime schema
# encoding: utf-8
# 方案说明
schema:
  schema_id: wanxiang
  name: 万象拼音EVO
  version: "LTS"
  author:
    - amzxyz
  description: |
    请勾选【万象拼音PRO】启用PRO版：带调词库、语法模型，支持全拼、双拼、整句及声调辅助筛选。
    在方案文本框输入代码：/pinyin 全拼；/flypy 小鹤；/mspy 微软；/zrm 自然码；/sogou 搜狗；/znabc 智能ABC；/ziguang 紫光；/pyjj 拼音加加；/gbpy 国标；/lxsq 乱序17；/ltsp 蓝天；/sdpy 首道；/wxsp 万象；/zrlong 自然龙；/hxlong 汉心龙；/jjf 间接辅助；/zjf 直接辅助。完整说明见 README.md。
  dependencies:
    - wanxiang_english  #中英文混合词汇

# 开关
# reset: 默认状态。注释掉后，切换窗口时不会重置到默认状态。
# states: 方案选单显示的名称。可以注释掉，仍可以通过快捷键切换。
# abbrev: 默认的缩写取 states 的第一个字符，abbrev 可自定义一个字符
switches:
  - name: ascii_mode
    states: [中文, 英文]
  - name: ascii_punct
    states: [中标, 英标]
  - name: full_shape
    states: [半角, 全角]
  - name: emoji
    states: [表情关, 表情开]
  - name: english_chinese
    states: [翻译关, 英译中]
  - name: chaifen_switch
    states: [拆分关, 拆分开]
  - name: charset_filter
    states: [大字集, 小字集]
    reset: 1
  - name: super_tips
    states: [提示关, 提示开]
  - name: context_reorder
    states: [上下文关, 上下文开]
  - options: [raw_input, tone_display, full_pinyin]
    states: [原编码, 有声调, 无声调]
    #reset: 2     #对于开关组从0开始数，第几个就reset几可设为默认
  - options: [comment_off, fuzhu_hint, tone_hint]
    states: [注释关, 辅助开, 读音开]
  - options: [s2s, s2t, s2hk, s2tw]
    states: [简体, 通繁, 港繁, 臺繁]
  - name: abbrev
    states: [简码关, 简码开]
    reset: 1
  - name: char_priority
    states: [词组先, 单字先]
  - name: english
    reset: 1
    states: [英文关, 英文开]
# 前端UI调用 set_option("zrm", true)，其余option互斥，完成输入类型切换
input_types:
  enabled: [zrm] #启用哪些build就部署哪些
  reset: zrm
  options:
    - {option: pinyin, label: 全拼}
    - {option: zrm, label: 自然码}
    - {option: flypy, label: 小鹤双拼}
    - {option: mspy, label: 微软双拼}
    - {option: sogou, label: 搜狗双拼}
    - {option: znabc, label: 智能ABC}
    - {option: ziguang, label: 紫光双拼}
    - {option: pyjj, label: 拼音加加}
    - {option: gbpy, label: 国标双拼}
    - {option: lxsq, label: 乱序17}
    - {option: ltsp, label: 蓝天双拼}
    - {option: sdpy, label: 首道双拼}
    - {option: wxsp, label: 万象双拼}
    - {option: zrlong, label: 自然龙}
    - {option: hxlong, label: 汉心龙}
# 输入引擎
engine:
  processors:
    - lua_processor@*wanxiang.force_upper_aux  #自动将N-1首选数量的汉字大写辅助码施加到音节后面起到固定语句分词的作用
    - lua_processor@*wanxiang.context_reorder*P  #靠自己养的专属上下文调频工具
    - lua_processor@*wanxiang.unicode_conversion*P  # 通过ctrl+u快捷键捕获当前高亮候选转换查询unicode，重复按下可还原
    - lua_processor@*wanxiang.super_processor  #KP小键盘、字母选词、符号快打、超强分词、重复限制、退格限制、声调回退、以词定字
    - lua_processor@*wanxiang.super_english*P  #英文只能加空格捕获按键操作
    - lua_processor@*wanxiang.super_tips  #超级提示模块：表情、简码、翻译、化学式、等等靠你想象
    - partial_commit  #按需提交，两个功能：ctrl+数字提交句子中的前几个字，以词定字
    - ascii_composer  #处理英文模式及中英文切换
    - recognizer  #与 matcher 搭配，处理符合特定规则的输入码，如网址、反查等 tags
    - keypad_processor  #处理小键数字键盘与主键盘联动策略
    - key_binder  #在特定条件下将按键绑定到其他按键，如重定义逗号、句号为候选翻页、开关快捷键等
    - lua_processor@*wanxiang.key_binder  #绑定按键扩展能力，支持正则扩展将按键生效情景更加细化
    - speller  #拼写处理器，接受字符按键，编辑输入
    - punctuator  #符号处理器，将单个字符按键直接映射为标点符号或文字
    - selector  #选字处理器，处理数字选字键〔可以换成别的哦〕、上、下候选定位、换页
    - navigator  #处理输入栏内的光标移动
    - express_editor  #编辑器，处理空格、回车上屏、回退键
  segmentors:
    - ascii_segmentor  #标识英文段落〔譬如在英文模式下〕字母直接上屛
    - matcher  #配合 recognizer 标识符合特定规则的段落，如网址、反查等，加上特定 tag
    - auxiliary_suffix_segmentor  #拆分 ` 后的后置辅助码
    - abc_segmentor  #标识常规的文字段落，加上 abc 这个 tag
    - affix_segmentor@wanxiang_reverse  #反查 tag
    - punct_segmentor  #标识符号段落〔键入标点符号用〕加上 punct 这个 tag
    - fallback_segmentor  #标识其他未标识段落，必须放在最后帮助tag模式切换后回退重新处理
  translators:
    - punct_translator  #配合 punct_segmentor 转换标点符号
    - script_translator  #脚本翻译器，用于拼音、粤拼等基于音节表的输入方案
    # - script_translator@user_dict_set
    # - script_translator@add_user_dict  #自造词之制造词汇入口
    - lua_translator@*wanxiang.version_display  #输入'/wx'，显示万象项目网址和当前版本号
    - lua_translator@*wanxiang.set_schema  #输入类似'/zrm'，快速切换为自然码双拼其余阅读文档
    - lua_translator@*wanxiang.shijian  #农历、日期、节气、节日、时间、周、问候模板等等，触发清单看下文
    - lua_translator@*wanxiang.unicode_conversion*T  #通过输入大写U引导，并输入Unicode编码获得汉字输出
    - lua_translator@*wanxiang.number_conversion  #数字、金额大写，通过输入大写R1234获得候选输出
    - lua_translator@*wanxiang.super_calculator  #超级计算器，Lua内查看高级用法
    - lua_translator@*wanxiang.input_statistics  #一个输入统计的脚本，以日、周、月、年等维度的统计
    - lua_translator@*wanxiang.random_tools  #  UUID/UUID7/ULID/随机密码
    - lua_translator@*wanxiang.super_symbols  #超级符号库：/sym.arrow.r.double→⇒  /sym?arrow 或 /sym/arrow 模糊搜索  /emoji.xxx 同理
    - lua_translator@*wanxiang.super_english*T  #英文词汇表导入，限流，格式化
    - table_translator@wanxiang_mixedcode  #混合编码词汇表导入
    - reverse_lookup_translator@wanxiang_reverse  #挂接部件组字和笔画反查
  filters:
    - lua_filter@*wanxiang.charset_filter  #放replacer前面,全方位自定义的字符集过滤器，支持繁体字符集开放
    #- lua_filter@*wanxiang.super_lookup  #字词输入中反查辅助筛选
    - lua_filter@*wanxiang.custom_phrase  #用户自定义置顶词与简码前置
    - lua_filter@*wanxiang.context_reorder*F  #用于输入编码后的上下文调频
    - lua_filter@*wanxiang.auto_phrase  #无感造词,英文造词
    - lua_filter@*wanxiang.super_comment_preedit  #放其他需要注释处理器后面,会有清空注释的操作,超级注释模块，支持错词提示、辅助码显示，部件组字读音注释，支持个性化配置和关闭相应的功能，详情搜索super_comment进行详细配置
    - rewriter@s2t
    - rewriter@s2hk
    - rewriter@s2tw
    - rewriter@emoji
    - rewriter@sentence
    #- rewriter@abbrev
    - lua_filter@*wanxiang.super_english*F  #负责英文方案及中英混输中英文单词格式化，语句流，自动加空格等策略
    - lua_filter@*wanxiang.super_filter  #先进行字符过滤后简繁转换，这样能繁体继承简体权重。本质功能相关功能见Lua文件
    - uniquifier  #去重,必须在最后

grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 6
  collocation_min_length: 2
  collocation_penalty: -14
  non_collocation_penalty: -6
  weak_collocation_penalty: -100
  rear_penalty: -18

keypad_processor:
  mode: auto  # auto / compose / select

# 按需提交
partial_commit:
  control_digits: true  # 启用ctrl+数字上屏前几个字
  first_key: "["  # 以词定字前字
  last_key: "]"  # 以词定字后字


# 主翻译器，拼音
translator:
  dictionary: wanxiang
  aux: 自然码
  user_dict: zc
  user_dict_mode: auto  # auto / manual / off
  aux_suffix: "`"
  prisms: input_types
  enable_completion: true  # 启用候选词补全
  contextual_suggestions: false  #模型用来开启词组权重预测，效果一般关闭
  max_homophones: 8
  #  disable_user_dict_for_patterns:
  #    - "^[a-z]{1,6}"    #基本的6码3字不调频
  enable_correction: false  #是否开启自动纠错
  initial_quality: 4  # 初始质量拼音的权重应该比英文大
  spelling_hints: 50  # 将注释以词典字符串形式完全暴露，通过super_comment.lua完全接管，灵活配置。
  always_show_comments: true  # Rime 默认在 preedit 等于 comment 时取消显示 comment，这里强制一直显示，供super_comment_preedit.lua做判断用。
  comment_format:  #将注释以词典字符串形式完全暴露，通过super_comment.lua完全接管，灵活配置。


# 自定义短语，用来置顶
custom_phrase:
  dictionary: custom_phrase
  user_dict_mode: off
  enable_completion: false
  always_show_comments: true
  spelling_hints: 50

# 自定义简码，用来游走在候选任意位置
abbrev_phrase:
  dictionary: wanxiang_abbrev
  user_dict_mode: off
  enable_completion: false
  always_show_comments: true
  spelling_hints: 50
  insert_position: 6  #前置简码到候选6
  max_candidates: 1  #前置1个简码

# 中文、英文、数字、符号等混合词汇
wanxiang_english:
  dictionary: wanxiang_english
  user_dict: en
  prisms: input_types
  enable_completion: true
  enable_sentence: false
  initial_quality: 2.1
  comment_format:  #这里很重要如果残留带声调字母，剩余编码提示计算出错引发程序崩溃
    - xform/^~.+$//
  #以下是lua相关配置，与原生处理器无关
  #英文自动加空格，除关闭外共有3种模式可供选择
  #off: 关闭; before: 总是前加; after: 总是后加;
  #smart: 智能模式连续输入英文时第二个单词前开始加空格，非输入状态的回车与空格都能打断加空格状态
  #支持设置延时销毁加空格状态，单位秒,0不超时，大于0为超时时间，极大的保证了连续输入的体验。
  english_spacing: smart
  spacing_timeout: 5
  max_candidates: 5  #英文候选输出最大候选数(适用于需要选单字组词的用户)
  trigger: "\\"  #英文造词符号\，写一个用时双击

wanxiang_mixedcode:
  dictionary: wanxiang_mixedcode
  prisms: input_types
  db_class: stabledb
  enable_completion: true
  enable_sentence: false
  initial_quality: 2
  comment_format:  #这里很重要如果残留带声调字母，剩余编码提示计算出错引发程序崩溃
    - xform/.*//
# 部件拆字反查

wanxiang_reverse:
  tag: wanxiang_reverse
  dictionary: wanxiang_reverse
  prisms: input_types
  enable_completion: true
  prefix: "`"  # 反查前缀（反查时前缀会消失），与 recognizer/patterns/wanxiang_reverse 匹配
  tips: "〔反查：拆分|笔画〕"
wanxiang_lookup:  #设置归属于super_lookup.lua
  tags: [abc, add_user_dict]  # 检索当前tag的候选
  key: "`"  # 输入中反查引导符，要添加到 speller/alphabet
  lookup: [wanxiang_reverse]  #反查滤镜数据库，万象都合并为一个了
  enable_tone: true  #启用声调反查
  data_source: ['aux', 'db']
  #data_source: ['db', 'aux']
  #用来配置你的反查数据来自哪里，注释aux：即词库携带的辅助编码，数据库db：即反查方案携带的两分、多分、笔画
  #谁在前哪种权重高比如 身db dian即dm，深aux dm 就能让相应的候选排在前面
  #但注释在前有时候与笔画的感知会有一定冲突，可针对习惯使用一类数据库即可

emoji:
  option: emoji
  tags: [abc]
  mode: derive
  files:
    - data/emoji.txt

abbrev:
  option: true
  tags: [abc]
  mode: abbrev
  insert_position: 6
  insert_count: 1
  promote_on_types:
    - table
    - user_table
    - completion
  fallback_on_empty: true
  files:
    - data/abbrev.txt

sentence:
  option: true
  tags: [abc]
  mode: derive
  enable_sentence: true
  files:
    - data/sentence.txt


s2t:
  option: [s2t, s2hk, s2tw]
  tags: [abc]
  mode: replace
  enable_sentence: true
  # preset: s2t  # 与 files 必须且只能配置一种
  files:
    - data/STPhrases.txt
    - data/STCharacters.txt

s2hk:
  option: s2hk
  tags: [abc]
  mode: replace
  enable_sentence: true
  # preset: s2hk  # 与 files 必须且只能配置一种
  files:
    - data/HKVariants.txt

s2tw:
  option: s2tw
  tags: [abc]
  mode: replace
  enable_sentence: true
  files:
    - data/TWVariants.txt

t9_abbrev:
  option: true
  tags: [abc]
  mode: abbrev
  insert_position: 3
  insert_count: 1
  # 首候选属于这些 type 时，全部简码提前。
  promote_on_types:
    - table
    - user_table
    - completion
  # 上游无候选时，是否释放全部简码兜底。
  fallback_on_empty: true
  # jys<TAB>静夜思
  # 部署后 lookup key = 597，preedit = jys。
  key_xlit: "abcdefghijklmnopqrstuvwxyz>22233344455566677778889999"
  files:
    - data/t9_abbrev.txt

build:
  dictionaries:
    wanxiang: #声明词表名称，翻译器可以调用

      algebra:  #编译类型prism调用的转写方式
        pinyin:
          __patch:
            - wanxiang_algebra:/全拼
