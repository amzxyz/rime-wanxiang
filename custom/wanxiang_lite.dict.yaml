# Rime dictionary
# encoding: utf-8
# 
# rime配置的部署位置：
# ~/.local/share/fcitx5/rime 或者 ~/.config/ibus/rime  (Linux)
# ~/Library/Rime  (Mac OS)
# %APPDATA%\Rime  (Windows)
# 
#

---
name: wanxiang_lite
version: "LTS"
sort: by_weight  #字典初始排序，可選original或by_weight
use_preset_vocabulary: false
import_tables:
  - dicts/zi.lite            #字表，包含了所有带拼音的汉字
  - dicts/jichu.lite         #基础词库，2-4字词汇
  - dicts/lianxiang.lite     #联想词库，5字以上词汇，多用于输入前半段第二候选可以出来整段
  - dicts/cuoyin.lite        #错音错字，支持错音和错字输入的兼容，同时供超级注释lua使用会在输入错误音节打出的时候给予提示
  - dicts/duoyin.lite        #兼容词库，是基础词库的扩充，收录了多场景多种读音的词组
  - dicts/shici.lite         #诗词
  - dicts/diming.lite        #地名
  - dicts/yixue.lite         #医学
  - dicts/huaxue.lite        #化学
  - dicts/yaopin.lite        #药品
  - dicts/mingren.lite       #名人
  - dicts/yiren.lite         #艺人
  - dicts/wuzhong.lite       #物种多样性
  - dicts/renming.lite       #高频人名
  - dicts/taifeng.lite       #最新台风表
  - dicts/fangyan.lite       #收集全国方言
...